<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Issues Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-gray-50">

  <header class="bg-white border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-2 font-bold text-2xl">
      <i class=" text-3xl fa-brands fa-github"></i> GitHub Issues Tracker
    </div>
    <div class="flex gap-4">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="Search issues..."
          class="border rounded-md pl-10 pr-4 py-2 w-64 focus:outline-none focus:ring-1 focus:ring-purple-500">
      </div>
      <button class="bg-[#6322F5] text-white px-4 py-2 rounded-md hover:bg-purple-700 font-semibold text-sm">+ New
        Issue</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-8">
    <div id="filter-container" class="bg-white p-4 rounded-lg border mb-8 flex gap-4">
      <button  id="btn-all"
        class="filter-btn bg-[#6322F5] text-white px-8 py-2 rounded-md text-sm font-medium">All</button>
      <button id="btn-open"
        class="filter-btn bg-white border px-8 py-2 rounded-md text-sm font-medium">Open</button>
      <button id="btn-closed"
        class="filter-btn bg-white border px-8 py-2 rounded-md text-sm font-medium">Closed</button>
    </div>

    <div class="bg-white p-6 rounded-t-lg border-x border-t flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="bg-purple-100 py-2 px-3 rounded-full text-purple-600">
          <i class="fa-solid fa-dharmachakra text-2xl"></i>
        </div>
        <div>
          <h2 id="issueCount" class="text-2xl font-bold text-gray-900">0 Issues</h2>
          <p class="text-gray-500 text-sm">Track and manage your project issues</p>
        </div>
      </div>
      <div class="flex gap-6 text-sm font-medium">
        <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> Open</span>
        <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-purple-600"></span> Closed</span>
      </div>
    </div>

    <div id="issues-grid"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 bg-white p-6 border-x border-b rounded-b-lg">
    </div>
  </main>`
  <!--pup up system-->
<div id="issueModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">

  <div class="bg-white w-[500px] rounded-xl p-6 shadow-lg">

    <h2 id="modalTitle" class="text-lg font-bold mb-3"></h2>

    <div class="flex gap-2 mb-3">
      <span id="modalStatus" class="px-2 py-1 text-xs rounded-full"></span>
      <span id="modalAuthor" class="text-sm text-gray-500"></span>
    </div>

    <div id="modalLabels" class="flex gap-2 mb-4"></div>

    <p id="modalDescription" class="text-sm text-gray-600 mb-6"></p>

    <div class="flex justify-between text-xl bg-gray-100 p-4 rounded-lg mt-5">
      <div>
        <p class="text-gray-700 ">Assignee:</p>
        <p id="modalAssignee" class="font-semibold "></p>
      </div>

      <div>
        <p class="text-gray-700">Priority:</p>
        <span id="modalPriority" class="px-2 py-1 rounded-full "></span>
      </div>
    </div>

    <div class="flex justify-end mt-6">
      <button id="closeModal"
        class="bg-[#6322F5] text-white px-4 py-2 rounded-md text-sm hover:bg-purple-700">
        Close
      </button>
    </div>

  </div>
</div>



  <script src="home.js"></script>
</body>

</html>
