<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Issues Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="login-container bg-white w-full max-w-md rounded-xl shadow-lg p-8">

    <!-- Logo -->
    <div class="login-nav justify-center mb-6 text text-center">
      <i class="fa-brands fa-github text-7xl"></i>
      <h1 class="text-2xl font-bold text-gray-800">GitHub Issues Tracker</h1>
      <p class="text-gray-500">Sign in to manage your issues</p>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-4">
      <label class="block text-sm font-medium">Username</label>
      <input type="text" id="username" placeholder="Enter Username"
        class="mt-1 w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">

      <p class="text-sm text-purple-700 mt-1">
        Default: admin
      </p>
      <label class="block text-sm font-medium">Password</label>
      <input type="password" id="password" placeholder="Enter Password"
        class="mt-1 w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">

      <p class="text-sm text-purple-700 mt-1">Default: admin123</p>

      <button type="submit"
        class="w-full bg-blue-700 text-white py-2 rounded-lg font-semibold hover:opacity-90 transition">Sign In</button>

    </form>


    <div class="divider text-center my-6">
      <span>OR</span>
    </div>


    <div class="demo-box text-center">
      <p class="text-sm text-gray-500 mb-4">Demo Credentials:</p>
      <p><span class="font-semibold">Username:</span> admin</p>
      <p><span class="font-semibold">Password:</span> admin123</p>
    </div>

  </div>

</body>
